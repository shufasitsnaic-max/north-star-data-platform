# North Star data platform — Compose stack.
#
# Phase 2 + 3 + 4 services (phase discipline: we don't scaffold later phases here).
#   kafka         — single-node broker in KRaft mode (no Zookeeper)
#   gateway       — FastAPI validate -> adapt -> produce to tlc-raw-events
#   simulator     — one-shot replay job, behind the "replay" profile
#   postgres      — serving store for hot-path window metrics
#   hot_path      — Kafka consumer -> event-time windows -> postgres
#   spark-master  — standalone Spark master for the cold-path jobs
#   spark-worker  — the one executor host; scale with `--scale spark-worker=N`
#
# Bring up the long-running core:      docker compose up -d kafka gateway postgres hot_path
# Bring up the cold path:              docker compose up -d spark-master spark-worker
# Trigger a replay when you're ready:  docker compose run --rm simulator
# Backfill one month into the lake. Note SPARK_MASTER, not `--master`:
# common/spark.py calls .master(config.SPARK_MASTER), and a builder's explicit
# .master() overrides whatever spark-submit was given, so the flag is silently
# ignored and the job runs local[*] inside this container.
#   docker compose exec -e SPARK_MASTER=spark://spark-master:7077 spark-master /opt/spark/bin/spark-submit /opt/batch_jobs/jobs/bulk_load.py --month 2023-01
# Recompute the post-cutoff half of the lake from the bus (no arguments — it
# reads the whole topic and owns everything past the cutoff). The --packages flag
# is required: the Kafka source is not in the image, and it is a launcher-time
# dependency the job cannot add for itself.
#   docker compose exec -e SPARK_MASTER=spark://spark-master:7077 spark-master /opt/spark/bin/spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3 /opt/batch_jobs/jobs/stream_to_lake.py
#
# Every stateful service gets an explicit named volume (no ephemeral data).

services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: kafka
    ports:
      # Host-facing listener, for console tools run from the host.
      - "9092:9092"
    environment:
      # --- KRaft: this one node is both broker and controller ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Two data listeners: PLAINTEXT for in-network clients (gateway), and
      # PLAINTEXT_HOST advertised as localhost for tools run on the host.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # --- single-node replication factors (a 1-node cluster can't do more) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # One partition by default so the simulator's global pickup_datetime order
      # is preserved on the topic (Kafka only orders within a partition).
      KAFKA_NUM_PARTITIONS: 1
      # Let the gateway's first produce create tlc-raw-events (1 partition).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Persist the log to the named volume, not container-ephemeral storage.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Broker is "ready" once it answers a metadata/list request.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8000:8000"
    environment:
      # In-network broker address (NOT localhost:9092 — that's host-only).
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: tlc-raw-events
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      # slim image has no curl; use stdlib to hit /health.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  simulator:
    build: ./simulator
    container_name: simulator
    # Profile => does NOT start on a bare `docker compose up`; run it on demand:
    #   docker compose run --rm simulator
    profiles: ["replay"]
    environment:
      GATEWAY_URL: http://gateway:8000
      DATA_DIR: /data/raw
      # Modest default replay for the P2 smoke test; override at runtime, e.g.
      #   docker compose run --rm -e MAX_ROWS=0 -e START_DATETIME=2024-01-01T00:00:00 simulator
      MAX_ROWS: "5000"
      SLEEP: "0"
    volumes:
      # Read-only: the simulator only ever reads the downloaded dataset.
      - ./data:/data:ro
    depends_on:
      gateway:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      # Host-facing, so `psql` from the dev container can run the P3 row scans.
      - "5432:5432"
    environment:
      # Local-development credentials only. Overridable from the environment so
      # a real deployment never inherits these; nothing secret is committed.
      POSTGRES_USER: ${POSTGRES_USER:-northstar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-northstar}
      POSTGRES_DB: ${POSTGRES_DB:-northstar}
    volumes:
      # Explicit named volume — the serving store must survive `docker compose down`.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready reports "accepting connections", which is what dependents need.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-northstar} -d ${POSTGRES_DB:-northstar}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  hot_path:
    build: ./hot_path
    container_name: hot_path
    environment:
      # In-network broker address (NOT localhost:9092 — that's host-only).
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: tlc-raw-events
      KAFKA_GROUP_ID: hot-path-windows
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-northstar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-northstar}
      POSTGRES_DB: ${POSTGRES_DB:-northstar}
      # Event-time window size. Data resolution, not display refresh rate —
      # demo pacing is the simulator's SLEEP, not this.
      WINDOW_MINUTES: "5"
      # How far past a window's end the watermark must advance before the window
      # is finalized. Absorbs mild out-of-order arrival.
      GRACE_MINUTES: "10"
      # Wall-clock cadence for rewriting still-filling windows, so the P6
      # dashboard sees the in-progress bucket. Does not commit offsets.
      FLUSH_INTERVAL_SECONDS: "2"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # A worker, not a server: restart it if it dies so a transient broker or
    # database blip doesn't silently stop the hot path.
    restart: unless-stopped

  # ── Cold path: standalone Spark ────────────────────────────────────────
  # A master and one worker, rather than local[*] inside a single container.
  # The point is that the cold-path jobs submit to a real cluster and would run
  # unchanged against a bigger one — Spark is admittedly oversized for ~45MB a
  # month, and that portability is the whole argument for it.
  spark-master:
    # First-party Apache image, pinned to the exact version batch_jobs/pyproject
    # pins pyspark to. A client newer than the cluster fails at task
    # deserialization, so that pin and this tag move together or not at all.
    image: apache/spark:3.5.3
    container_name: spark-master
    # The image ships no default server command; spark-class runs the master in
    # the foreground, which is what Compose wants (no daemonizing).
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      # Master web UI. On 8081 because 8080 is reserved for Airflow's webserver
      # in step 5 — moving it later would mean re-teaching the port to muscle
      # memory and to the devcontainer's forwardPorts.
      - "8081:8080"
      # Submit/RPC port, host-facing so a driver can be run from the dev
      # container during development.
      - "7077:7077"
    environment:
      # Keep the master's own logs off /opt/spark, which the non-default user
      # below does not own. See the `user:` comment.
      SPARK_LOG_DIR: /tmp/spark-logs
      # The image has no home directory for uid 1000, and the JVM will try to
      # use one. Point it somewhere writable rather than let it guess.
      HOME: /tmp
    # Run as the dev container's user (uid 1000), not the image's `spark` user
    # (uid 185). Everything this cluster writes lands in a host bind mount, and
    # files owned by 185 would be unreadable from the dev container terminal —
    # which is exactly where the P4 verification reads the lake back with
    # pyarrow. Owning the output is worth overriding the image default for.
    user: "1000:1000"
    volumes:
      # The lake is read-write and gets an explicit mount, per the
      # no-ephemeral-state rule. The raw drop is read-only: jobs only read it.
      - ./data/lake:/data/lake
      - ./data/raw:/data/raw:ro
      # The job source, mounted read-only so spark-submit can reach it without
      # an orchestration image — that image is step 5's problem, not step 2's.
      - ./batch_jobs:/opt/batch_jobs:ro
      # Settings that must exist before a JVM starts, so they cannot come from
      # common/spark.py. Currently just the Ivy cache location.
      - ./batch_jobs/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      # Makes uid 1000 a *resolvable* user inside the container, not just a
      # number. Hadoop's UnixLoginModule builds a UnixPrincipal from the passwd
      # entry, and with no entry it hands the constructor a null name and dies
      # with `KerberosAuthException: failure to login` before Spark starts. This
      # is identity resolution, not permissions — chmod would not have helped.
      - /etc/passwd:/etc/passwd:ro
    healthcheck:
      # Tested with bash's /dev/tcp because this image ships no curl and no
      # wget — a healthcheck that can never pass leaves the worker waiting on
      # `service_healthy` forever, which reads as a registration bug.
      #
      # Probes the web UI, not the RPC port: a raw TCP connect to 7077 sends no
      # valid RPC handshake, so the master logs a netty stack trace and
      # "got disassociated, removing it" on every single check.
      #
      # The RPC fallback exists because the two ports bind differently. The
      # master's RPC endpoint binds to the address its hostname resolves to, so
      # localhost:7077 is refused even when the master is perfectly healthy
      # (measured). The UI is expected on 0.0.0.0, but rather than bet the
      # worker's startup on that, fall back to the address the RPC port is
      # known to answer on.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8080 || </dev/tcp/$$(hostname)/7077' || exit 1"]
      # 15s rather than 10s: nothing downstream needs sub-minute detection, and
      # a cold JVM start is the only case that matters here.
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  spark-worker:
    image: apache/spark:3.5.3
    # No container_name: it would block `docker compose up --scale spark-worker=N`,
    # which is the cheapest way to show the cold path scaling horizontally.
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      # Worker UI. Range-mapped so scaling past one worker doesn't collide.
      - "8082-8085:8081"
    environment:
      # Explicit limits. Kafka, Postgres, the gateway and the hot path are
      # already resident on a 16GB codespace; an unbounded worker would claim
      # most of what Spark can see and leave the rest of the stack thrashing.
      SPARK_WORKER_CORES: "3"
      SPARK_WORKER_MEMORY: 4g
      # Scratch + logs under /tmp for the same ownership reason as the master.
      SPARK_WORKER_DIR: /tmp/spark-work
      SPARK_LOG_DIR: /tmp/spark-logs
      HOME: /tmp
    user: "1000:1000"
    volumes:
      # Executors write the lake's Parquet files themselves, so the worker needs
      # the same read-write mount the master has — not a read-only copy.
      - ./data/lake:/data/lake
      - ./data/raw:/data/raw:ro
      - ./batch_jobs:/opt/batch_jobs:ro
      # Settings that must exist before a JVM starts, so they cannot come from
      # common/spark.py. Currently just the Ivy cache location.
      - ./batch_jobs/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      # Same reason as the master: uid 1000 must resolve to a name or Hadoop's
      # login fails before the worker starts.
      - /etc/passwd:/etc/passwd:ro
    depends_on:
      spark-master:
        condition: service_healthy
    # A worker, not a server: restart it so a transient master blip doesn't
    # silently leave the cluster with no executors.
    restart: unless-stopped

volumes:
  kafka-data:
  postgres-data: