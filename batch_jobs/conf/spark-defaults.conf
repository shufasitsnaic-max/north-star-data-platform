# Cluster-wide Spark defaults, mounted over /opt/spark/conf/spark-defaults.conf
# in both spark-master and spark-worker.
#
# This file exists for settings that must be in place *before* a JVM starts, so
# they cannot be set from common/spark.py the way spark.master and the SQL
# options are. Anything a running session can configure belongs in that module
# instead — keep the split, or it becomes unclear which file wins.

# Where Ivy resolves and caches connector JARs (--packages).
#
# Without this, Ivy writes to Java's `user.home`, which on Linux comes from the
# passwd entry rather than the HOME environment variable. The Spark containers
# run as uid 1000 with the host's /etc/passwd mounted in, so user.home resolves
# to /home/vscode — a directory that does not exist in the apache/spark image.
# The failure is a bare FileNotFoundException on an Ivy temp file, which does
# not obviously point at a home-directory problem.
#
# /tmp is writable by any uid. The cache therefore lives as long as the
# container does: repeated submits reuse it, but recreating the container means
# re-downloading. That is a few seconds and avoids a bind mount whose ownership
# would need managing.
spark.jars.ivy /tmp/.ivy2
